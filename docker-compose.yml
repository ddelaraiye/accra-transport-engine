version: '3.8'
services:
  postgis_db:
    image: pgrouting/pgrouting
    container_name: accra_transit_db
    environment:
      POSTGRES_USER: transit_admin
      POSTGRES_PASSWORD: ghana_transit_2024
      POSTGRES_DB: informal_transport
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

volumes:
  pgdata: