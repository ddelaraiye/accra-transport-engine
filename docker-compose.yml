version: '3.8'
services:
  postgis_db:
    image: pgrouting/pgrouting
    container_name: accra_transit_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-informal_transport}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

volumes:
  pgdata: